<!DOCTYPE html>
<html lang="de" class="h-full select-none">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#04040a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Neon Multi Mini Game Hub</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/hub.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body class="h-full w-full overflow-hidden bg-[#04040a] text-slate-100 font-rajdhani touch-action-none">
  <div id="app" class="relative h-full w-full flex flex-col">
    <!-- Globale Top-Leiste -->
    <header class="relative z-20 shrink-0 flex items-center justify-between px-3 sm:px-4 py-2 sm:py-3 border-b border-cyan-500/20 bg-slate-950/75 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <button
          id="hub-home-btn"
          type="button"
          class="hidden items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold tracking-wider uppercase border border-cyan-400/40 bg-cyan-500/10 text-cyan-300 hover:bg-cyan-500/20 active:scale-95 transition"
        >
          <span>← Hub</span>
        </button>
        <div>
          <h1 id="header-title" class="font-orbitron text-base sm:text-lg font-black tracking-widest text-cyan-300 neon-text-cyan">
            NEON ARCADE HUB
          </h1>
          <p id="header-subtitle" class="text-[11px] uppercase tracking-widest text-slate-400">
            Modular Mini Game Collection
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button
          id="control-mode-btn"
          type="button"
          class="hidden px-3 py-1.5 rounded-lg text-xs font-bold tracking-wider uppercase border border-cyan-400/40 bg-cyan-500/10 text-cyan-300 hover:bg-cyan-500/20 active:scale-95 transition"
        >
          🎮 Buttons
        </button>
        <button
          id="pause-toggle-btn"
          type="button"
          class="hidden px-3 py-1.5 rounded-lg text-xs font-bold tracking-wider uppercase border border-fuchsia-400/40 bg-fuchsia-500/10 text-fuchsia-300 hover:bg-fuchsia-500/20 active:scale-95 transition"
        >
          Pause
        </button>
        <button
          id="sound-toggle-btn"
          type="button"
          aria-label="Ton umschalten"
          class="px-3 py-1.5 rounded-lg text-xs font-bold tracking-wider uppercase border border-slate-700 bg-slate-900/90 text-cyan-300 hover:border-cyan-400/50 active:scale-95 transition"
        >
          🔊 Sound
        </button>
      </div>
    </header>

    <!-- Hub-Startansicht (Spielauswahl) -->
    <main id="hub-view" class="relative z-10 flex-1 overflow-y-auto px-4 py-6 sm:px-8">
      <div class="max-w-5xl mx-auto">
        <div class="mb-6">
          <span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-widest bg-cyan-500/10 text-cyan-300 border border-cyan-400/30 mb-2">
            Mobile & Multi-Touch Ready
          </span>
          <h2 class="font-orbitron text-2xl sm:text-3xl font-black text-white">
            Wähle ein <span class="text-cyan-300 neon-text-cyan">Minispiel</span>
          </h2>
          <p class="text-sm sm:text-base text-slate-400 mt-1">
            Jedes Spiel läuft als eigenes Modul und lässt sich später unabhängig erweitern.
          </p>
        </div>

        <!-- Dynamische Spielkarten -->
        <div id="game-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
    </main>

    <!-- Aktive Spielansicht -->
    <section id="game-stage-wrapper" class="hidden relative flex-1 w-full min-h-0 overflow-hidden">
      <div id="game-stage" class="relative w-full h-full touch-none overflow-hidden"></div>

      <!-- Pause-Overlay -->
      <div
        id="pause-overlay"
        class="hidden absolute inset-0 z-30 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4"
      >
        <div class="w-full max-w-xs rounded-2xl border border-cyan-400/40 bg-slate-900/95 p-6 text-center shadow-[0_0_35px_rgba(34,211,238,0.2)]">
          <h3 class="font-orbitron text-xl font-black text-cyan-300 mb-2">PAUSIERT</h3>
          <p class="text-sm text-slate-400 mb-6">Spiel angehalten</p>
          <div class="flex flex-col gap-2.5">
            <button
              id="resume-btn"
              type="button"
              class="w-full py-2.5 rounded-xl font-bold uppercase tracking-wider text-sm bg-cyan-400 text-slate-950 hover:bg-cyan-300 active:scale-95 transition"
            >
              Weiter
            </button>
            <button
              id="restart-from-pause-btn"
              type="button"
              class="w-full py-2.5 rounded-xl font-bold uppercase tracking-wider text-sm border border-slate-700 bg-slate-800 text-slate-200 hover:bg-slate-700 active:scale-95 transition"
            >
              Neu starten
            </button>
            <button
              id="exit-to-hub-btn"
              type="button"
              class="w-full py-2.5 rounded-xl font-bold uppercase tracking-wider text-sm border border-fuchsia-500/40 bg-fuchsia-500/10 text-fuchsia-300 hover:bg-fuchsia-500/20 active:scale-95 transition"
            >
              Zurück zum Hub
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Module in fester Reihenfolge laden -->
  <script src="./js/hub.js"></script>
  <script src="./games/_template.js"></script>
  <script src="./games/pong.js"></script>
  <script src="./games/snake.js"></script>
  <script src="./games/airhockey.js"></script>
  <script src="./games/brickbreaker.js"></script>
  <script src="./games/spaceinvaders.js"></script>
  <script src="./games/spacetaxi.js"></script>
  <script src="./games/Pandapitfall/index.js"></script>
  <script src="./games/pandapitfall.js"></script>
  <script src="games/yetiadventure.js"></script>
  <script src="./games/pandiesabenteuer.js"></script>
  <script src="./games/Pandiesabenteuer/index.js"></script>
  <script src="./js/global-controls-fix.js"></script>
</body>
</html>
